name: ORB Dock Station

on:
  push:
    paths:
      - 'Orb_Assistant/user_dock_station/**'
      - 'frontend/src/index.tsx'
      - 'frontend/src/orb-client/**'
      - 'frontend/src/landing/orbArrivalAudioPolicy.ts'
      - 'frontend/src/landing/orbVoiceOnly.css'
      - 'frontend/scripts/orb-pointer-e2e-proof.js'
      - '.github/workflows/orb-dock-station.yml'
  pull_request:
    paths:
      - 'Orb_Assistant/user_dock_station/**'
      - 'frontend/src/index.tsx'
      - 'frontend/src/orb-client/**'
      - 'frontend/src/landing/orbArrivalAudioPolicy.ts'
      - 'frontend/src/landing/orbVoiceOnly.css'
      - 'frontend/scripts/orb-pointer-e2e-proof.js'
      - '.github/workflows/orb-dock-station.yml'

permissions:
  contents: read

jobs:
  profile-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Dock Station profile and provider contracts
        run: node --test Orb_Assistant/user_dock_station/tests/*.test.js
      - name: Syntax-check Dock Station runtime files
        run: |
          node --check Orb_Assistant/user_dock_station/config.js
          node --check Orb_Assistant/user_dock_station/control-plane.js
          node --check Orb_Assistant/user_dock_station/provider-router.js
          node --check Orb_Assistant/user_dock_station/articulation-contract.js
          node --check Orb_Assistant/user_dock_station/runtime-client.js
          node --check Orb_Assistant/user_dock_station/main.js
          node --check Orb_Assistant/user_dock_station/preload.js
          node --check Orb_Assistant/user_dock_station/renderer.js

  website-orb-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check warm voice-only ORB startup
        working-directory: frontend
        run: npm run typecheck

  website-orb-pointer-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build current Website ORB loader
        working-directory: frontend
        run: npm run build:orb-loader
      - name: Prove question-to-Point/Ping browser guidance
        working-directory: frontend
        run: node scripts/orb-pointer-e2e-proof.js
      - name: Preserve visual proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orb-pointer-e2e-proof
          path: frontend/test-artifacts/orb-pointer-e2e-proof.png
          if-no-files-found: error
