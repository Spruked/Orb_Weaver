name: Rendered DOM Validation

on:
  pull_request:
    paths:
      - "backend/app/crawler/rendered_dom.py"
      - "backend/app/crawler/__init__.py"
      - "backend/tests/test_rendered_dom.py"
      - "backend/Dockerfile"
      - "frontend/src/components/OrbAssemblyStatus.tsx"
      - ".github/workflows/rendered-dom-validation.yml"
  push:
    paths:
      - "backend/app/crawler/rendered_dom.py"
      - "backend/app/crawler/__init__.py"
      - "backend/tests/test_rendered_dom.py"
      - "backend/Dockerfile"
      - "frontend/src/components/OrbAssemblyStatus.tsx"
      - ".github/workflows/rendered-dom-validation.yml"

permissions:
  contents: read

jobs:
  rendered-dom-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Compile rendered DOM module
        run: python -m py_compile backend/app/crawler/rendered_dom.py backend/tests/test_rendered_dom.py

      - name: Run rendered DOM tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_rendered_dom.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Type-check assembly status UI
        run: npm run typecheck --prefix frontend
