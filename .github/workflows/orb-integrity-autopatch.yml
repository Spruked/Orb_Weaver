name: Orb Integrity Autopatch

on:
  push:
    branches:
      - orb-integrity-fix3-guidance
    paths:
      - ".github/workflows/orb-integrity-autopatch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integrity branch
        uses: actions/checkout@v4
        with:
          ref: orb-integrity-fix3-guidance
          fetch-depth: 0

      - name: Apply bounded authority and crawl-artifact repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("backend/main.py")
          main_text = main_path.read_text(encoding="utf-8")
          old_main = '''        payload = _client_crawl_pack(project, crawl_job, pages, db)\n        latest_path = root / "current" / "latest_crawl.json"\n        history_path = root / "history" / f"crawl_{crawl_job.id}.json"\n        _write_json(latest_path, payload)\n        _write_json(history_path, payload)\n        pointer_path = root / "website_orb_context" / "pointer_plot_map.json"\n        existing_pointer_map = _load_json_if_present(pointer_path) or {}\n        new_pointer_map = payload["pointer_plot_map"]\n        if int(new_pointer_map.get("record_count") or 0) > 0:\n            new_pointer_map = merge_canonical_pointer_authority(existing_pointer_map, new_pointer_map)\n            payload["pointer_plot_map"] = new_pointer_map\n            payload["website_orb_context"]["pointer_plot_map"] = new_pointer_map\n            _write_json(pointer_path, new_pointer_map)\n        elif int(existing_pointer_map.get("record_count") or 0) == 0:\n            _write_json(pointer_path, new_pointer_map)\n        else:\n            payload["website_orb_context"]["pointer_plot_map"] = existing_pointer_map\n            payload["website_orb_context"]["pointer_map_preservation"] = {\n                "status": "preserved_previous_verified_map",\n                "rejected_crawl_id": str(crawl_job.id),\n                "reason": "new_crawl_produced_zero_pointer_records",\n            }\n        _write_json(root / "website_orb_context" / "latest_context.json", payload["website_orb_context"])\n'''
          new_main = '''        payload = _client_crawl_pack(project, crawl_job, pages, db)\n        latest_path = root / "current" / "latest_crawl.json"\n        history_path = root / "history" / f"crawl_{crawl_job.id}.json"\n        pointer_path = root / "website_orb_context" / "pointer_plot_map.json"\n        existing_pointer_map = _load_json_if_present(pointer_path) or {}\n        new_pointer_map = payload["pointer_plot_map"]\n        if int(new_pointer_map.get("record_count") or 0) > 0:\n            new_pointer_map = merge_canonical_pointer_authority(existing_pointer_map, new_pointer_map)\n            payload["pointer_plot_map"] = new_pointer_map\n            payload["website_orb_context"]["pointer_plot_map"] = new_pointer_map\n            _write_json(pointer_path, new_pointer_map)\n        elif int(existing_pointer_map.get("record_count") or 0) == 0:\n            _write_json(pointer_path, new_pointer_map)\n        else:\n            payload["pointer_plot_map"] = existing_pointer_map\n            payload["website_orb_context"]["pointer_plot_map"] = existing_pointer_map\n            payload["website_orb_context"]["pointer_map_preservation"] = {\n                "status": "preserved_previous_verified_map",\n                "rejected_crawl_id": str(crawl_job.id),\n                "reason": "new_crawl_produced_zero_pointer_records",\n            }\n        # Persist crawl-facing artifacts only after canonical pointer authority has\n        # been reconciled so current/history/context cannot disagree about the\n        # authority state published by this crawl.\n        _write_json(latest_path, payload)\n        _write_json(history_path, payload)\n        _write_json(root / "website_orb_context" / "latest_context.json", payload["website_orb_context"])\n'''
          if main_text.count(old_main) != 1:
              raise SystemExit("preserve_client_crawl_intelligence patch anchor did not match exactly once")
          main_path.write_text(main_text.replace(old_main, new_main, 1), encoding="utf-8")

          recovery_path = Path("backend/app/orb/pointer_recovery.py")
          recovery_text = recovery_path.read_text(encoding="utf-8")
          old_reject = '''        record["finding_class"] = "BLOCKED"\n        record["finding_subreason"] = "owner_rejected_pointer_identity"\n        record["authority_history"] = [\n            *(record.get("authority_history") or []),\n            {\n                "event": "owner_rejected",\n                "from": prior_health,\n                "to": "OWNER_REJECTED",\n                "reviewer": reviewer,\n                "signature_hash": signature_hash,\n                "decided_at": timestamp,\n                "notes": notes,\n                "identity_hash": _pointer_identity_hash(record),\n            },\n        ]\n'''
          new_reject = '''        record["finding_class"] = "BLOCKED"\n        record["finding_subreason"] = "owner_rejected_pointer_identity"\n        authority = {\n            "state": "OWNER_REJECTED",\n            "reviewer": reviewer,\n            "signature_hash": signature_hash,\n            "decided_at": timestamp,\n            "notes": notes,\n            "identity_hash": _pointer_identity_hash(record),\n        }\n        record["owner_authority"] = authority\n        record["authority_history"] = [\n            *(record.get("authority_history") or []),\n            {\n                "event": "owner_rejected",\n                "from": prior_health,\n                "to": "OWNER_REJECTED",\n                **authority,\n            },\n        ]\n'''
          if recovery_text.count(old_reject) != 1:
              raise SystemExit("reject_owner_pointer patch anchor did not match exactly once")
          recovery_path.write_text(recovery_text.replace(old_reject, new_reject, 1), encoding="utf-8")

          test_path = Path("backend/tests/test_pointer_recovery.py")
          test_text = test_path.read_text(encoding="utf-8")
          old_asserts = '''    quality = rejected["quality"]\n    assert len(rejected["records"]) == 11\n    assert quality["total_record_count"] == 11\n'''
          new_asserts = '''    quality = rejected["quality"]\n    rejected_pointer = next(item for item in rejected["records"] if item["target_id"] == "unsafe")\n    assert rejected_pointer["owner_authority"]["state"] == "OWNER_REJECTED"\n    assert rejected_pointer["owner_authority"]["signature_hash"] == "signed-rejection"\n    assert len(rejected["records"]) == 11\n    assert quality["total_record_count"] == 11\n'''
          if test_text.count(old_asserts) != 1:
              raise SystemExit("owner rejection test patch anchor did not match exactly once")
          test_text = test_text.replace(old_asserts, new_asserts, 1)
          old_retained = '''    assert pointer["finding_subreason"] == "owner_rejected_pointer_identity"\n    assert pointer["runtime_policy"]["may_point"] is False\n    assert retained["quality"]["excluded_count"] == 1\n'''
          new_retained = '''    assert pointer["finding_subreason"] == "owner_rejected_pointer_identity"\n    assert pointer["runtime_policy"]["may_point"] is False\n    assert pointer["owner_authority"]["state"] == "OWNER_REJECTED"\n    assert pointer["owner_authority"]["signature_hash"] == "signed-rejection"\n    assert retained["quality"]["excluded_count"] == 1\n'''
          if test_text.count(old_retained) != 1:
              raise SystemExit("retained rejection test patch anchor did not match exactly once")
          test_path.write_text(test_text.replace(old_retained, new_retained, 1), encoding="utf-8")
          PY

      - name: Syntax-check repaired modules
        run: python -m py_compile backend/main.py backend/app/orb/pointer_recovery.py

      - name: Remove temporary autopatch workflow
        run: rm .github/workflows/orb-integrity-autopatch.yml

      - name: Commit bounded repair
        run: |
          git config user.name "Orb Weaver Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/main.py backend/app/orb/pointer_recovery.py backend/tests/test_pointer_recovery.py .github/workflows/orb-integrity-autopatch.yml
          git commit -m "Repair canonical pointer artifact coherence [integrity-bot]"
          git push origin HEAD:orb-integrity-fix3-guidance
