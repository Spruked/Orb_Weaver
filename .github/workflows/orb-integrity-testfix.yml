name: Orb Integrity Test Fix

on:
  push:
    branches:
      - orb-integrity-fix3-guidance
    paths:
      - ".github/workflows/orb-integrity-testfix.yml"

permissions:
  contents: write

jobs:
  repair-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integrity branch
        uses: actions/checkout@v4
        with:
          ref: orb-integrity-fix3-guidance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Repair Vault-grounded lifecycle regression fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/tests/test_lifecycle_api.py")
          text = path.read_text(encoding="utf-8")
          old = '    root = tmp_path / "client"\n'
          new = '    root = main.client_root("authority.test")\n'
          if text.count(old) != 1:
              raise SystemExit("lifecycle regression fixture anchor did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run FIX 1-3 authority regressions
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_pointer_recovery.py \
            backend/tests/test_lifecycle_api.py::test_ordinary_crawl_preserves_owner_approval_and_rejection_everywhere

      - name: Remove temporary workflow and commit passing fixture
        run: |
          rm .github/workflows/orb-integrity-testfix.yml
          git config user.name "Orb Weaver Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/tests/test_lifecycle_api.py .github/workflows/orb-integrity-testfix.yml
          git commit -m "Ground pointer authority regression in canonical Vault [integrity-bot]"
          git push origin HEAD:orb-integrity-fix3-guidance
