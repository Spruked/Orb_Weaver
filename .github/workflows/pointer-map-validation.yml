name: Pointer Map Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/main.py"
      - "backend/app/core/storage.py"
      - "backend/app/orb/navigation_world.py"
      - "backend/app/orb/pointer_map_optimizer.py"
      - "backend/app/orb/pointer_recovery_integration.py"
      - "backend/app/orb/__init__.py"
      - "backend/app/orb/pointer_recovery.py"
      - "backend/app/orb/pointer_plot.py"
      - "backend/tests/test_navigation_world.py"
      - "backend/tests/test_lifecycle_api.py"
      - "backend/tests/test_orb_loader_runtime.py"
      - "backend/tests/test_pointer_map_optimizer.py"
      - "backend/tests/test_pointer_recovery.py"
      - "backend/tests/test_pointer_recovery_integration.py"
      - "scripts/validate_pointer_plot_map.py"
      - ".github/workflows/pointer-map-validation.yml"
  pull_request:
    paths:
      - "backend/main.py"
      - "backend/app/core/storage.py"
      - "backend/app/orb/navigation_world.py"
      - "backend/app/orb/pointer_map_optimizer.py"
      - "backend/app/orb/pointer_recovery_integration.py"
      - "backend/app/orb/__init__.py"
      - "backend/app/orb/pointer_recovery.py"
      - "backend/app/orb/pointer_plot.py"
      - "backend/tests/test_navigation_world.py"
      - "backend/tests/test_lifecycle_api.py"
      - "backend/tests/test_orb_loader_runtime.py"
      - "backend/tests/test_pointer_map_optimizer.py"
      - "backend/tests/test_pointer_recovery.py"
      - "backend/tests/test_pointer_recovery_integration.py"
      - "scripts/validate_pointer_plot_map.py"
      - ".github/workflows/pointer-map-validation.yml"

permissions:
  contents: read

jobs:
  pointer-map-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Compile pointer and lifecycle modules
        run: |
          python -m py_compile \
            backend/main.py \
            backend/app/orb/navigation_world.py \
            backend/app/orb/pointer_recovery.py \
            backend/app/orb/pointer_map_optimizer.py \
            backend/app/orb/pointer_recovery_integration.py \
            scripts/validate_pointer_plot_map.py

      - name: Run pointer authority, navigation-world, and map regressions
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_navigation_world.py \
            backend/tests/test_pointer_map_optimizer.py \
            backend/tests/test_pointer_recovery.py \
            backend/tests/test_pointer_recovery_integration.py \
            backend/tests/test_lifecycle_api.py::test_owner_pointer_authority_is_signed_and_persisted_in_canonical_vault \
            backend/tests/test_lifecycle_api.py::test_ordinary_crawl_preserves_owner_approval_and_rejection_everywhere \
            backend/tests/test_orb_loader_runtime.py::test_bootstrap_blocks_unverified_pointer_context \
            backend/tests/test_orb_loader_runtime.py::test_bootstrap_exposes_verified_target_guidance_while_deployment_recovery_remains \
            backend/tests/test_orb_loader_runtime.py::test_scan_assembly_does_not_call_global_recovery_orb_ready
