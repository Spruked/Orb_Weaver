name: Orb Guidance Gate Autopatch

on:
  push:
    branches:
      - orb-integrity-fix3-guidance
    paths:
      - ".github/workflows/orb-guidance-gate-autopatch.yml"

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out integrity branch
        uses: actions/checkout@v4
        with:
          ref: orb-integrity-fix3-guidance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          cd frontend && npm ci

      - name: Apply target-scoped guidance gate repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          # 1) One fail-closed target-guidance predicate owns backend eligibility semantics.
          recovery_path = Path("backend/app/orb/pointer_recovery.py")
          recovery = recovery_path.read_text(encoding="utf-8")
          anchor = '''    }\n\n\ndef classify_uncertainty(record: Dict[str, Any], peers: Iterable[Dict[str, Any]] = ()) -> List[str]:\n'''
          helper = '''    }\n\n\ndef pointer_guidance_eligible(record: Dict[str, Any]) -> bool:\n    """Return True only when this exact active target has explicit point authority."""\n    if not isinstance(record, dict):\n        return False\n    if record.get("status") not in (None, "active"):\n        return False\n    if str(record.get("confidence_class") or "") not in {"VERIFIED", "STABLE"}:\n        return False\n    if (record.get("runtime_policy") or {}).get("may_point") is not True:\n        return False\n    if str(record.get("pointer_health") or "") in {"OWNER_REJECTED", "DEPRECATED", "REMOVED"}:\n        return False\n    if record.get("finding_subreason") == "owner_rejected_pointer_identity":\n        return False\n    return True\n\n\ndef guidance_eligible_pointer_count(pointer_map: Dict[str, Any]) -> int:\n    return sum(\n        1\n        for record in pointer_map.get("records") or []\n        if pointer_guidance_eligible(record)\n    )\n\n\ndef classify_uncertainty(record: Dict[str, Any], peers: Iterable[Dict[str, Any]] = ()) -> List[str]:\n'''
          recovery = replace_once(recovery, anchor, helper, "pointer guidance helper")
          recovery_path.write_text(recovery, encoding="utf-8")

          # 2) Main runtime uses the same predicate everywhere; map quality remains global/deployment-only.
          main_path = Path("backend/main.py")
          main = main_path.read_text(encoding="utf-8")
          main = replace_once(
              main,
              '''from app.orb.pointer_recovery import (\n    assess_pointer_quality,\n    merge_canonical_pointer_authority,\n''',
              '''from app.orb.pointer_recovery import (\n    assess_pointer_quality,\n    guidance_eligible_pointer_count,\n    merge_canonical_pointer_authority,\n    pointer_guidance_eligible,\n''',
              "main pointer recovery imports",
          )
          main = replace_once(
              main,
              '''        "guidance_eligible": (\n            record.get("confidence_class") in {"VERIFIED", "STABLE"}\n            and (record.get("runtime_policy") or {}).get("may_point") is not False\n        ),\n''',
              '''        "guidance_eligible": pointer_guidance_eligible(record),\n''',
              "pointer summary eligibility",
          )
          main = replace_once(
              main,
              '''    guidance_eligible = sum(\n        1\n        for record in records\n        if record.get("confidence_class") in {"VERIFIED", "STABLE"}\n        and (record.get("runtime_policy") or {}).get("may_point") is not False\n    )\n''',
              '''    guidance_eligible = sum(1 for record in records if pointer_guidance_eligible(record))\n''',
              "pointer summary count",
          )
          main = replace_once(
              main,
              '''                guidance_count = sum(\n                    1\n                    for record in recovered_map.get("records") or []\n                    if str(record.get("confidence_class") or "") in {"VERIFIED", "STABLE"}\n                    and (record.get("runtime_policy") or {}).get("may_point") is not False\n                )\n''',
              '''                guidance_count = guidance_eligible_pointer_count(recovered_map)\n''',
              "recovery guidance count",
          )
          main = replace_once(
              main,
              '''        guidance_count = sum(\n            1\n            for record in updated_map.get("records") or []\n            if str(record.get("confidence_class") or "") in {"VERIFIED", "STABLE"}\n            and (record.get("runtime_policy") or {}).get("may_point") is not False\n        )\n        guidance_complete = not quality.get("recovery_required") and guidance_count > 0\n''',
              '''        guidance_count = guidance_eligible_pointer_count(updated_map)\n        # Target guidance is local authority. Global map recovery remains a\n        # deployment/coverage signal and must not contaminate an unrelated\n        # owner-verified target.\n        guidance_complete = guidance_count > 0\n''',
              "post-owner guidance gate",
          )
          main = replace_once(
              main,
              '''    orb_ready = complete and all(stage_status(stage_id) == "COMPLETE" for stage_id in required_stage_ids)\n''',
              '''    orb_ready = (\n        complete\n        and all(stage_status(stage_id) == "COMPLETE" for stage_id in required_stage_ids)\n        and not recovery_required\n    )\n''',
              "deployment orb_ready gate",
          )
          main = replace_once(
              main,
              '''    pointer_quality = pointer_map.get("quality") or assess_pointer_quality(pointer_map)\n    pointer_recovery_required = bool(pointer_quality.get("recovery_required"))\n    ready = (\n''',
              '''    pointer_quality = pointer_map.get("quality") or assess_pointer_quality(pointer_map)\n    pointer_recovery_required = bool(pointer_quality.get("recovery_required"))\n    target_guidance_count = guidance_eligible_pointer_count(pointer_map)\n    target_guidance_available = runtime_guidance_status == "COMPLETE" and target_guidance_count > 0\n    ready = (\n''',
              "bootstrap target guidance split",
          )
          main = replace_once(
              main,
              '''        "pointer_guidance": {\n            "status": runtime_guidance_status,\n            "safe_pointer_count": int(pointer_quality.get("stable_count") or 0),\n            "blocked_pointer_count": int(pointer_quality.get("uncertain_count") or 0),\n            "automatic_recovery_attempts_maximum": 1,\n        },\n''',
              '''        "pointer_guidance": {\n            "status": runtime_guidance_status,\n            "target_guidance_available": target_guidance_available,\n            "safe_pointer_count": target_guidance_count,\n            "blocked_pointer_count": max(0, int(pointer_map.get("record_count") or 0) - target_guidance_count),\n            "map_recovery_required": pointer_recovery_required,\n            "automatic_recovery_attempts_maximum": 1,\n        },\n''',
              "bootstrap pointer guidance payload",
          )
          main_path.write_text(main, encoding="utf-8")

          # 3) Backend regressions: permission is explicit, one approved target can guide, deployment stays strict.
          pointer_test_path = Path("backend/tests/test_pointer_recovery.py")
          pointer_tests = pointer_test_path.read_text(encoding="utf-8")
          pointer_tests = replace_once(
              pointer_tests,
              '''    assess_pointer_quality,\n    merge_canonical_pointer_authority,\n''',
              '''    assess_pointer_quality,\n    guidance_eligible_pointer_count,\n    merge_canonical_pointer_authority,\n    pointer_guidance_eligible,\n''',
              "pointer test imports",
          )
          pointer_tests += '''\n\ndef test_guidance_requires_explicit_target_permission_and_safe_state():\n    explicit = record("explicit", "STABLE", "#explicit")\n    assert pointer_guidance_eligible(explicit) is True\n\n    missing_permission = record("missing", "STABLE", "#missing")\n    missing_permission["runtime_policy"] = {}\n    assert pointer_guidance_eligible(missing_permission) is False\n\n    uncertain = record("uncertain-guidance", "UNCERTAIN", "#uncertain")\n    uncertain["runtime_policy"] = {"may_point": True}\n    assert pointer_guidance_eligible(uncertain) is False\n\n    rejected = record("rejected-guidance", "STABLE", "#rejected")\n    rejected["pointer_health"] = "OWNER_REJECTED"\n    rejected["finding_subreason"] = "owner_rejected_pointer_identity"\n    assert pointer_guidance_eligible(rejected) is False\n\n    assert guidance_eligible_pointer_count({"records": [explicit, missing_permission, uncertain, rejected]}) == 1\n'''
          pointer_test_path.write_text(pointer_tests, encoding="utf-8")

          lifecycle_path = Path("backend/tests/test_lifecycle_api.py")
          lifecycle = lifecycle_path.read_text(encoding="utf-8")
          lifecycle = replace_once(
              lifecycle,
              '''    with main.SessionLocal() as db:\n        job = main.LifecycleJob(\n            project_id=project_id,\n            job_type="POINTER_RECOVERY",\n            status="REVIEW_REQUIRED",\n            phase="awaiting_pointer_visual_review",\n        )\n''',
              '''    with main.SessionLocal() as db:\n        crawl = main.CrawlJob(\n            project_id=project_id,\n            status="completed",\n            config={"scan_stage_execution": {}},\n        )\n        db.add(crawl)\n        db.flush()\n        job = main.LifecycleJob(\n            project_id=project_id,\n            job_type="POINTER_RECOVERY",\n            status="REVIEW_REQUIRED",\n            phase="awaiting_pointer_visual_review",\n            result={"crawl_job_id": str(crawl.id)},\n        )\n''',
              "owner authority lifecycle crawl setup",
          )
          lifecycle = replace_once(
              lifecycle,
              '''        db.commit()\n        job_id = job.id\n\n    denied = client.post(\n''',
              '''        db.commit()\n        job_id = job.id\n        crawl_id = crawl.id\n\n    denied = client.post(\n''',
              "owner authority crawl id capture",
          )
          lifecycle = replace_once(
              lifecycle,
              '''    assert authority["decisions"][0]["target_id"] == "book-consult"\n    assert authority["decisions"][0]["signature_hash"] == payload["signature_hash"]\n\n\ndef test_site_scan_requires_an_approved_map''',
              '''    assert authority["decisions"][0]["target_id"] == "book-consult"\n    assert authority["decisions"][0]["signature_hash"] == payload["signature_hash"]\n\n    with main.SessionLocal() as db:\n        baseline = db.get(main.CrawlJob, crawl_id)\n        execution = (baseline.config or {})["scan_stage_execution"]\n        assert execution["runtime_guidance"]["status"] == "COMPLETE"\n        assert execution["runtime_guidance"]["output_count"] == 1\n        # One explicitly approved target is usable even though the global\n        # deployment quality still fails the ten-pointer coverage floor.\n        assert (baseline.config or {})["verified_pointer_quality"]["recovery_required"] is True\n\n\ndef test_site_scan_requires_an_approved_map''',
              "owner authority local/global assertions",
          )
          lifecycle_path.write_text(lifecycle, encoding="utf-8")

          loader_test_path = Path("backend/tests/test_orb_loader_runtime.py")
          loader_tests = loader_test_path.read_text(encoding="utf-8")
          loader_tests = replace_once(
              loader_tests,
              '''    assert payload["pointer_guidance"]["status"] == "NOT_STARTED"\n    assert payload["pointer_guidance"]["safe_pointer_count"] == 1\n''',
              '''    assert payload["pointer_guidance"]["status"] == "NOT_STARTED"\n    assert payload["pointer_guidance"]["target_guidance_available"] is False\n    assert payload["pointer_guidance"]["safe_pointer_count"] == 1\n    assert payload["pointer_guidance"]["map_recovery_required"] is True\n''',
              "bootstrap blocked guidance assertions",
          )
          loader_tests += '''\n\ndef test_bootstrap_exposes_verified_target_guidance_while_deployment_recovery_remains(tmp_path, monkeypatch):\n    main, client = load_app(tmp_path, monkeypatch)\n    context_path = (\n        main.client_root("campaign.orbweaver.spruked.com")\n        / "website_orb_context"\n        / "latest_context.json"\n    )\n    context = json.loads(context_path.read_text(encoding="utf-8"))\n    context["scan_stage_execution"] = {\n        "runtime_guidance": {"status": "COMPLETE", "output_count": 1}\n    }\n    context_path.write_text(json.dumps(context), encoding="utf-8")\n\n    response = client.post(\n        "/api/orb/bootstrap",\n        headers={"Origin": "https://demo.openai.chatgpt.site"},\n        json={\n            "site_id": "orb-weaver-campaign",\n            "target_url": "https://demo.openai.chatgpt.site/",\n            "loader_version": "1",\n            "page_context": page_context(),\n        },\n    )\n    assert response.status_code == 200, response.text\n    payload = response.json()\n    assert payload["status"] == "awaiting_scan"\n    assert payload["pointer_guidance"]["status"] == "COMPLETE"\n    assert payload["pointer_guidance"]["target_guidance_available"] is True\n    assert payload["pointer_guidance"]["safe_pointer_count"] == 1\n    assert payload["pointer_guidance"]["map_recovery_required"] is True\n    assert payload["deployment_preflight"] == {\n        "passed": False,\n        "blockers": ["POINTER_RECOVERY_REQUIRED"],\n    }\n\n\ndef test_scan_assembly_does_not_call_global_recovery_orb_ready(tmp_path, monkeypatch):\n    main, _client = load_app(tmp_path, monkeypatch)\n    required_stage_ids = {\n        "url_discovery", "crawl_control", "page_fetch", "javascript_rendering",\n        "page_content_scan", "content_structure_extraction", "schema_extraction", "mobile_ux_analysis",\n        "semantic_indexing", "lexical_indexing", "entity_extraction", "relationship_mapping",\n        "pointer_mapping", "route_classification", "knowledge_chunking", "retrieval_index_build",\n        "source_validation", "pointer_verification", "pointer_recovery", "runtime_guidance",\n    }\n    crawl = main.CrawlJob(\n        id=9001,\n        status="completed",\n        config={"scan_stage_execution": {stage: {"status": "COMPLETE"} for stage in required_stage_ids}},\n    )\n    page = main.CrawledPage(\n        url="https://campaign.orbweaver.spruked.com/",\n        semantic_analysis={\n            "pointer_plot_records": [{\n                "target_id": "only-safe-target",\n                "page_route": "/",\n                "target_type": "button",\n                "meaning": "button: Start",\n                "semantic_locator": "#start",\n                "content_fingerprint": "start",\n                "allowed_actions": ["point"],\n                "confidence": 0.95,\n                "confidence_class": "STABLE",\n                "runtime_policy": {"may_point": True},\n            }]\n        },\n    )\n    result = main._scan_assembly_status(crawl, [page], {})\n    assert result["overall_status"] == "analysis_complete"\n'''
          loader_test_path.write_text(loader_tests, encoding="utf-8")

          # 4) Browser runtime fails closed on absent permission and exposes split status truthfully.
          types_path = Path("frontend/src/orb-client/types.ts")
          types = types_path.read_text(encoding="utf-8")
          types = replace_once(
              types,
              '''  pointer_health?: 'NEW' | 'VERIFIED' | 'RECOVERED' | 'OWNER_VERIFIED' | 'DEPRECATED' | 'REMOVED';\n''',
              '''  pointer_health?: 'NEW' | 'VERIFIED' | 'RECOVERED' | 'OWNER_VERIFIED' | 'OWNER_REJECTED' | 'DEPRECATED' | 'REMOVED';\n''',
              "frontend rejected authority type",
          )
          types = replace_once(
              types,
              '''  pointer_guidance?: { status: 'ready' | 'recovery_required'; safe_pointer_count: number; blocked_pointer_count: number; automatic_recovery_attempts_maximum: number };\n''',
              '''  pointer_guidance?: { status: string; target_guidance_available: boolean; safe_pointer_count: number; blocked_pointer_count: number; map_recovery_required: boolean; automatic_recovery_attempts_maximum: number };\n''',
              "frontend pointer guidance type",
          )
          types_path.write_text(types, encoding="utf-8")

          mount_path = Path("frontend/src/orb-client/orb-mount.ts")
          mount = mount_path.read_text(encoding="utf-8")
          mount = replace_once(
              mount,
              '''  const mayPoint = (record: OrbPointerRecord) => {\n    if (record.confidence_class === 'UNCERTAIN' || record.confidence_class === 'BLOCKED') return false;\n    if (record.runtime_policy?.may_point === false) return false;\n    return record.confidence_class === 'VERIFIED' || record.confidence_class === 'STABLE';\n  };\n''',
              '''  const mayPoint = (record: OrbPointerRecord) => {\n    if (record.confidence_class === 'UNCERTAIN' || record.confidence_class === 'BLOCKED') return false;\n    if (record.runtime_policy?.may_point !== true) return false;\n    if (record.pointer_health === 'OWNER_REJECTED' || record.pointer_health === 'DEPRECATED' || record.pointer_health === 'REMOVED') return false;\n    return record.confidence_class === 'VERIFIED' || record.confidence_class === 'STABLE';\n  };\n''',
              "frontend fail closed mayPoint",
          )
          mount = replace_once(
              mount,
              '''      const ready = response.status === 'ready';\n      const recoveringPointers = response.pointer_guidance?.status === 'recovery_required';\n      setStatus(ready ? 'online' : 'pending', ready ? (recoveringPointers ? 'Connected · pointer recovery' : 'Connected') : 'Connected · scan pending');\n      const name = String(response.site_world.site_name || response.site_world.brand || response.site.name || 'this site');\n      setMessage(ready\n        ? recoveringPointers\n          ? 'I am connected to ' + name + '. I can answer questions while the pointer map completes recovery; only verified guidance is enabled.'\n          : 'I am connected to ' + name + ' and ready to guide you.'\n        : 'The loader is connected. This published site still needs its first Orb Weaver scan.');\n''',
              '''      const ready = response.status === 'ready';\n      const recoveringPointers = response.pointer_guidance?.map_recovery_required === true;\n      const targetGuidanceAvailable = response.pointer_guidance?.target_guidance_available === true;\n      setStatus(\n        ready ? 'online' : 'pending',\n        ready\n          ? (recoveringPointers ? 'Connected · pointer recovery' : 'Connected')\n          : targetGuidanceAvailable\n            ? 'Connected · verified guidance'\n            : 'Connected · scan pending',\n      );\n      const name = String(response.site_world.site_name || response.site_world.brand || response.site.name || 'this site');\n      setMessage(ready\n        ? recoveringPointers\n          ? 'I am connected to ' + name + '. I can answer questions while the pointer map completes recovery; only verified guidance is enabled.'\n          : 'I am connected to ' + name + ' and ready to guide you.'\n        : targetGuidanceAvailable\n          ? 'I am connected to ' + name + '. Verified target guidance is available while broader pointer coverage remains under review.'\n          : 'The loader is connected. This published site still needs verified Orb Weaver guidance evidence.');\n''',
              "frontend split status copy",
          )
          mount_path.write_text(mount, encoding="utf-8")

          # 5) Permanent CI must watch the actual Website ORB runtime and the new focused proofs.
          pointer_ci_path = Path(".github/workflows/pointer-map-validation.yml")
          pointer_ci = pointer_ci_path.read_text(encoding="utf-8")
          pointer_ci = replace_once(
              pointer_ci,
              '''      - "backend/tests/test_lifecycle_api.py"\n      - "backend/tests/test_pointer_map_optimizer.py"\n''',
              '''      - "backend/tests/test_lifecycle_api.py"\n      - "backend/tests/test_orb_loader_runtime.py"\n      - "backend/tests/test_pointer_map_optimizer.py"\n''',
              "pointer CI loader path",
          )
          pointer_ci = replace_once(
              pointer_ci,
              '''            backend/tests/test_pointer_recovery_integration.py \\\n            backend/tests/test_lifecycle_api.py::test_ordinary_crawl_preserves_owner_approval_and_rejection_everywhere\n''',
              '''            backend/tests/test_pointer_recovery_integration.py \\\n            backend/tests/test_lifecycle_api.py::test_owner_pointer_authority_is_signed_and_persisted_in_canonical_vault \\\n            backend/tests/test_lifecycle_api.py::test_ordinary_crawl_preserves_owner_approval_and_rejection_everywhere \\\n            backend/tests/test_orb_loader_runtime.py::test_bootstrap_blocks_unverified_pointer_context \\\n            backend/tests/test_orb_loader_runtime.py::test_bootstrap_exposes_verified_target_guidance_while_deployment_recovery_remains \\\n            backend/tests/test_orb_loader_runtime.py::test_scan_assembly_does_not_call_global_recovery_orb_ready\n''',
              "pointer CI focused proofs",
          )
          pointer_ci_path.write_text(pointer_ci, encoding="utf-8")

          dock_ci_path = Path(".github/workflows/orb-dock-station.yml")
          dock_ci = dock_ci_path.read_text(encoding="utf-8")
          dock_ci = dock_ci.replace("      - 'frontend/src/index.tsx'\n", "      - 'frontend/src/index.tsx'\n      - 'frontend/src/orb-client/**'\n")
          if dock_ci.count("      - 'frontend/src/orb-client/**'\n") != 2:
              raise SystemExit("Dock Station orb-client path must appear in push and pull_request filters")
          dock_ci_path.write_text(dock_ci, encoding="utf-8")
          PY

      - name: Compile repaired backend
        run: python -m py_compile backend/main.py backend/app/orb/pointer_recovery.py

      - name: Prove target-scoped guidance and global deployment separation
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q \
            backend/tests/test_pointer_recovery.py \
            backend/tests/test_lifecycle_api.py::test_owner_pointer_authority_is_signed_and_persisted_in_canonical_vault \
            backend/tests/test_lifecycle_api.py::test_ordinary_crawl_preserves_owner_approval_and_rejection_everywhere \
            backend/tests/test_orb_loader_runtime.py::test_bootstrap_blocks_unverified_pointer_context \
            backend/tests/test_orb_loader_runtime.py::test_bootstrap_exposes_verified_target_guidance_while_deployment_recovery_remains \
            backend/tests/test_orb_loader_runtime.py::test_scan_assembly_does_not_call_global_recovery_orb_ready

      - name: Type-check Website ORB runtime
        working-directory: frontend
        run: npm run typecheck

      - name: Remove temporary workflow and commit proven repair
        run: |
          rm .github/workflows/orb-guidance-gate-autopatch.yml
          git config user.name "Orb Weaver Integrity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/main.py \
            backend/app/orb/pointer_recovery.py \
            backend/tests/test_pointer_recovery.py \
            backend/tests/test_lifecycle_api.py \
            backend/tests/test_orb_loader_runtime.py \
            frontend/src/orb-client/types.ts \
            frontend/src/orb-client/orb-mount.ts \
            .github/workflows/pointer-map-validation.yml \
            .github/workflows/orb-dock-station.yml \
            .github/workflows/orb-guidance-gate-autopatch.yml
          git commit -m "Split target guidance authority from global map readiness [integrity-bot]"
          git push origin HEAD:orb-integrity-fix3-guidance
