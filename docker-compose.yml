services:
  orb-weaver:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${ORB_WEAVER_UID:-1000}
        APP_GID: ${ORB_WEAVER_GID:-1000}
    user: "${ORB_WEAVER_UID:-1000}:${ORB_WEAVER_GID:-1000}"
    ports:
      - "16500:16500"
      - "16510:16510"
    environment:
      - DATABASE_URL=sqlite:////app/vault_system/databases/orb_weaver.db
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://host.docker.internal:16520/api/generate}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-orb-auto}
      - LOCAL_LLM_TIMEOUT_SECONDS=${LOCAL_LLM_TIMEOUT_SECONDS:-60}
      - LOCAL_LLM_KEEP_ALIVE=${LOCAL_LLM_KEEP_ALIVE:-30m}
      - LOCAL_LLM_NUM_CTX=${LOCAL_LLM_NUM_CTX:-512}
      - LOCAL_LLM_NUM_PREDICT=${LOCAL_LLM_NUM_PREDICT:-32}
      - LOCAL_LLM_TEMPERATURE=${LOCAL_LLM_TEMPERATURE:-0.35}
      # Development-only frontier ORB observer. Replace this placeholder with the direct Google AI Studio key before rebuilding locally.
      - GEMINI_API_KEY=REPLACE_WITH_YOUR_GEMINI_API_KEY
      - ORB_WEAVER_VAULT_ROOT=/app/vault_system
      - ORB_WEAVER_SUBSTRATE_ROOT=/app/vault_system
      - PUBLIC_BASE_URL=http://127.0.0.1:16510
      - CHROME_PATH=/usr/bin/chromium
      - CHROME_BIN=/usr/bin/chromium
      - CHROME_DEVTOOLS_CLI=chrome-devtools
      - CHROME_DEVTOOLS_ENABLED=true
      - CHROME_DEVTOOLS_PUBLIC_ENABLED=false
      - CHROME_DEVTOOLS_OUTPUT_ROOT=/app/vault_system/runtime/browser_reviews
      - CHROME_DEVTOOLS_START_ARGS=["--no-sandbox","--disable-dev-shm-usage"]
      - ORB_DESKTOP_MCP_ENABLED=${ORB_DESKTOP_MCP_ENABLED:-true}
      - ORB_DESKTOP_MCP_ROOT=/app/rdrive_mcp_server
      - ORB_DESKTOP_MCP_PYTHON=python3.12
      - ORB_DESKTOP_MCP_TIMEOUT_SECONDS=${ORB_DESKTOP_MCP_TIMEOUT_SECONDS:-20}
      - ORB_DESKTOP_MCP_URL=${ORB_DESKTOP_MCP_URL:-http://host.docker.internal:8765}
      - ORB_DESKTOP_MCP_TOKEN=${ORB_DESKTOP_MCP_TOKEN:-}
      - TESSERACT_CMD=/usr/bin/tesseract
      - ORB_ASSISTANT_ROOT=/app/Orb_Assistant
      - FASTER_WHISPER_STT_URL=http://host.docker.internal:9000/stt
      - ORB_TTS_CACHE_DIR=/app/vault_system/runtime/tts_cache
      - ORB_TTS_TIMEOUT_SECONDS=${ORB_TTS_TIMEOUT_SECONDS:-180}
      - ORB_TTS_QWEN_URL=${ORB_TTS_QWEN_URL:-http://host.docker.internal:9880/speak}
      - ORB_TTS_QWEN_API_KEY=${ORB_TTS_QWEN_API_KEY:-}
      - ORB_TTS_QWEN_MODEL=${ORB_TTS_QWEN_MODEL:-qwen-tts}
      - ORB_TTS_QWEN_VOICE=${ORB_TTS_QWEN_VOICE:-OrbWeaver}
      - ORB_TTS_QWEN_LANGUAGE=${ORB_TTS_QWEN_LANGUAGE:-English}
      - ORB_TTS_QWEN_INSTRUCT=${ORB_TTS_QWEN_INSTRUCT:-A warm, confident adult male assistant voice. Clear, calm, lightly theatrical, friendly, and concise.}
      - ORB_TTS_QWEN_FORMAT=${ORB_TTS_QWEN_FORMAT:-wav}
      - ORB_TTS_QWEN_PAYLOAD_MODE=${ORB_TTS_QWEN_PAYLOAD_MODE:-qwen-voice-clone}
      - ORB_TTS_KOKORO_URL=${ORB_TTS_KOKORO_URL:-http://host.docker.internal:8880/speak}
      - ORB_TTS_KOKORO_API_KEY=${ORB_TTS_KOKORO_API_KEY:-}
      - ORB_TTS_KOKORO_MODEL=${ORB_TTS_KOKORO_MODEL:-kokoro}
      - ORB_TTS_KOKORO_VOICE=${ORB_TTS_KOKORO_VOICE:-am_michael}
      - ORB_TTS_KOKORO_FORMAT=${ORB_TTS_KOKORO_FORMAT:-wav}
      - ORB_TTS_KOKORO_PAYLOAD_MODE=${ORB_TTS_KOKORO_PAYLOAD_MODE:-kokoro-direct}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_API_VERSION=${STRIPE_API_VERSION:-2026-02-25.clover}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_API_BASE=${PAYPAL_API_BASE:-https://api-m.paypal.com}
      - SQUARE_ENVIRONMENT=${SQUARE_ENVIRONMENT:-production}
      - SQUARE_APPLICATION_ID=${SQUARE_APPLICATION_ID:-}
      - SQUARE_LOCATION_ID=${SQUARE_LOCATION_ID:-}
      - SQUARE_ACCESS_TOKEN=${SQUARE_ACCESS_TOKEN:-}
      - SQUARE_VERSION=${SQUARE_VERSION:-2026-07-15}
      - SQUARE_REDIRECT_URL=${SQUARE_REDIRECT_URL:-}
      # >>> PLACE IT HERE WITH YOUR OTHER SECRETS/ENV VARS <<<
      - GOOGLE_APPLICATION_CREDENTIALS=/app/vault_system/secrets/ga4-key.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./vault_system:/app/vault_system
      - ./.runtime/rdrive_mcp_server:/app/rdrive_mcp_server:ro
    depends_on:
      - redis

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "6380:6379"
