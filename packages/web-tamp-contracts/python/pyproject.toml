[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-weaver-web-tamp-contracts"
version = "0.1.0"
description = "Canonical Web-TAMP contracts shared by Orb Weaver runtimes"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.5,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
