server {
    listen 16510;
    server_name _;

    root /app/frontend/build;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:16500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:16500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Stable third-party installer URL. Revalidate so loader fixes reach hosts
    # without requiring customers to edit their installation snippet.
    location = /orb-loader.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Fingerprinted Create React App bundles must never fall through to the SPA.
    # If a browser requests a stale or missing hash, return 404 instead of HTML
    # that it will attempt to parse as JavaScript or CSS.
    location /static/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
